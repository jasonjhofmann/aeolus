name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Ruff (lint)
        run: uv run --python 3.14 --with ruff ruff check custom_components/ tests/

      - name: Ruff (format check)
        run: uv run --python 3.14 --with ruff ruff format --check custom_components/ tests/

      # Aeolus has no runtime dependency; it imports homeassistant + voluptuous.
      # Type-checked against the declared support floor (hacs.json 2026.7.0), not the
      # newest release: HA 2026.9 moved core to probatio and 2026.10 retyped schema
      # arguments as probatio.Schema, so mypy against the latest HA rejects the
      # voluptuous schemas the floor needs (probatio does not exist before 2026.9).
      # HA still accepts voluptuous schemas at runtime; the pytest job, which
      # resolves the latest harness, covers runtime on the newest HA.
      - name: Mypy (strict)
        run: |
          uv run --python 3.14 \
            --with mypy \
            --with homeassistant==2026.7.0 \
            --with voluptuous \
            mypy custom_components/aeolus/

  # Guards the declared support floor (hacs.json homeassistant: 2026.7.0 — note that
  # "homeassistant" is not a valid manifest.json key, so hacs.json is the only place it
  # is declared — and HA 2026.7 declares requires-python >=3.14.2). A construct newer
  # than the floor slipping in fails here as a SyntaxError in CI instead of on a user's
  # install where the integration won't load. The floor currently coincides with the
  # newest tested Python; this job regains independent value as soon as they diverge.
  syntax-floor:
    name: Syntax floor (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Compile on Python 3.14 (support floor)
        run: uv run --python 3.14 --no-project python -m compileall -q custom_components/

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The HA 2026.7 floor declares requires-python >=3.14.2, so 3.14 is now both
        # the support floor and current. 3.13 was removed, not merely deprioritized:
        # it resolves a pre-2026.7 HA (observed: 2026.2.3), which has no
        # UnitOfDensity/UnitOfRatio, so the integration fails at import.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pytest (with coverage gate)
        run: |
          uv run --python ${{ matrix.python-version }} \
            --with pytest-homeassistant-custom-component \
            --with pytest-cov \
            python -m pytest tests/ -q \
              --cov=custom_components.aeolus \
              --cov-report=term-missing \
              --cov-fail-under=90
