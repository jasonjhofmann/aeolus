name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so drift in the latest Home Assistant shows up the day it lands
    # instead of at the next push.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Ruff (lint)
        run: uv run --python 3.14 --with ruff ruff check custom_components/ tests/

      - name: Ruff (format check)
        run: uv run --python 3.14 --with ruff ruff format --check custom_components/ tests/

  # Guards the declared support floor (hacs.json homeassistant: 2026.7.0 — note that
  # "homeassistant" is not a valid manifest.json key, so hacs.json is the only place it
  # is declared — and HA 2026.7 declares requires-python >=3.14.2). A construct newer
  # than the floor slipping in fails here as a SyntaxError in CI instead of on a user's
  # install where the integration won't load. The floor currently coincides with the
  # newest tested Python; this job regains independent value as soon as they diverge.
  syntax-floor:
    name: Syntax floor (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Compile on Python 3.14 (support floor)
        run: uv run --python 3.14 --no-project python -m compileall -q custom_components/

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The HA 2026.7 floor declares requires-python >=3.14.2, so 3.14 is now both
        # the support floor and current. 3.13 was removed, not merely deprioritized:
        # it resolves a pre-2026.7 HA (observed: 2026.2.3), which has no
        # UnitOfDensity/UnitOfRatio, so the integration fails at import.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pytest (with coverage gate)
        run: |
          uv run --python ${{ matrix.python-version }} \
            --with pytest-homeassistant-custom-component \
            --with pytest-cov \
            python -m pytest tests/ -q \
              --cov=custom_components.aeolus \
              --cov-report=term-missing \
              --cov-fail-under=90

  # Proves the floor declared in hacs.json is real. The other gates resolve
  # the LATEST Home Assistant, so code could start depending on a newer API
  # while HACS keeps offering the release to users on the declared floor.
  # Reads the floor from hacs.json and the integration's own requirements
  # from manifest.json, then imports every module and type-checks against
  # that exact release.
  #
  # This is also the only mypy run. HA 2026.9 moved core to probatio and
  # 2026.10 retyped schema arguments as probatio.Schema, so mypy against the
  # latest HA rejects the voluptuous schemas older releases need (probatio
  # does not exist before 2026.9). HA still accepts voluptuous schemas at
  # runtime, and the test job covers runtime on the newest HA.
  minimum-supported-ha:
    name: Minimum supported HA (hacs.json floor)
    runs-on: ubuntu-latest
    env:
      # Must satisfy the floor's requires-python (HA 2026.7.0 = Python
      # 3.14.2+), and stay below 3.15: uv would otherwise pick CPython 3.15, where
      # HA 2026.7.0's pinned Pillow has no wheel.
      FLOOR_PYTHON: ">=3.14.2,<3.15"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pin the floor and the integration's requirements
        run: |
          python3 - <<'PY'
          import json
          floor = json.load(open("hacs.json"))["homeassistant"]
          reqs = json.load(open("custom_components/aeolus/manifest.json"))["requirements"]
          with open("floor-requirements.txt", "w") as f:
              f.write("\n".join([f"homeassistant=={floor}", "voluptuous", *reqs]) + "\n")
          print(f"Declared Home Assistant floor: {floor}; requirements: {reqs}")
          PY

      - name: Import every module against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            python -c "
          import importlib, pkgutil
          import custom_components.aeolus as pkg
          names = [m.name for m in pkgutil.iter_modules(pkg.__path__)]
          for name in names:
              importlib.import_module(f'{pkg.__name__}.{name}')
          print(f'{len(names)} modules import on the declared floor')
          "

      - name: Mypy (strict) against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            --with mypy \
            mypy custom_components/aeolus/
