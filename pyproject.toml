[project]
name = "aeolus"
version = "0.5.5"
description = "Adaptive, multi-zone CO2 & ventilation manager for Home Assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
# Supported floor = Home Assistant 2026.7 (the hacs.json minimum — "homeassistant" is
# not a valid manifest.json key), which declares requires-python >=3.14.2. The code
# must import on 3.14 — see [tool.ruff] target-version.
requires-python = ">=3.14"

[tool.ruff]
# target-version = the OLDEST supported Python, per the ruff docs. The HA 2026.7 floor
# declares requires-python >=3.14.2, so the oldest supported Python is now 3.14.
# Keep this pinned to the floor. History, still load-bearing as a rule: while the floor
# was 3.13, py314 let pyupgrade rewrite `except (A, B):` into the bare `except A, B:`
# (PEP 758) — a SyntaxError on 3.13 that broke v0.5.1. At a 3.14 floor that rewrite is
# legal on every supported runtime, so it is now permitted rather than a hazard.
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Domain notation that is intentional, not a typo: × (multiplication), – (en dash),
# − (minus), α (EMA smoothing factor). Keep them legible instead of ASCII-mangling.
allowed-confusables = ["×", "–", "−", "α"]

[tool.mypy]
# Analyzes the code against the INSTALLED Home Assistant core. With the HA 2026.7 floor
# the SUPPORT floor is also 3.14 (ruff target-version above), so these two now coincide.
# They remain distinct knobs — ruff = the syntax we emit (floor); mypy = the runtime we
# type-check against (latest) — and will diverge again when HA's Python floor moves.
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
